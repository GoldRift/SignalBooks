[project]
name = "signalbooks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "selectolax>=0.3.21"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
